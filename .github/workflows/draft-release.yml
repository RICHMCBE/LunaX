name: Release LunaX

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    name: Validate tagged source
    uses: ./.github/workflows/main.yml

  release:
    name: Build and publish tagged PHAR
    needs: [ci]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: axolotl-pm/setup-php-action@b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e
        with:
          php-version: "8.3"
          install-path: "./bin"
          pm-version-major: 5

      - name: Install Composer dependencies
        run: composer install --no-dev --classmap-authoritative --prefer-dist --no-interaction

      - name: Build PHAR and metadata
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          BUILD_NUMBER=$((2300+RUN_NUMBER))
          PHP_URL="https://github.com/axolotl-pm/PHP-Binaries/releases/tag/pm5-php-8.3-latest"
          php vendor/teamselenyx/bedrock-data/.minify_json.php
          php -dphar.readonly=0 build/server-phar.php --git "$COMMIT" --build "$BUILD_NUMBER"
          test -s LunaX.phar
          php build/generate-build-info-json.php "$COMMIT" "$TAG" "$REPOSITORY" "$BUILD_NUMBER" "$RUN_ID" "$PHP_URL" > build_info.json
          MC_VERSION=$(php build/dump-version-info.php mcpe_version)
          NOTES="docs/update-$MC_VERSION.ko.md"
          test -s "$NOTES"
          sed "s|](bedrock-1.26.60-preview-prep.md)|](https://github.com/$REPOSITORY/blob/$TAG/docs/bedrock-1.26.60-preview-prep.md)|g" "$NOTES" > release-notes.md
          printf '\n\n[PHP 바이너리 다운로드](%s)\n' "$PHP_URL" >> release-notes.md
          sha256sum LunaX.phar > SHA256SUMS
          PRERELEASE=$(php build/dump-version-info.php prerelease)
          if [[ "$(php build/dump-version-info.php is_dev)" == "true" || "$TAG" == *preview* ]]; then
            PRERELEASE=true
          fi
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"

      - name: Save build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: LunaX-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            LunaX.phar
            build_info.json
            SHA256SUMS
            release-notes.md
            server-start.*

      - name: Publish release with update notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" LunaX.phar build_info.json SHA256SUMS server-start.* --clobber
            gh release edit "$TAG" --notes-file release-notes.md --prerelease="$PRERELEASE"
          else
            gh release create "$TAG" LunaX.phar build_info.json SHA256SUMS server-start.* --verify-tag --title "LunaX $TAG" --notes-file release-notes.md --prerelease="$PRERELEASE"
          fi
